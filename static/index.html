<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU System - University Search & Chat</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🎓 EDU System</div>
            <div id="user-info" class="hidden">
                <span id="username-display"></span>
                <button id="logout-btn">Logout</button>
            </div>
        </nav>
    </header>

    <main>
        <!-- Auth Section -->
        <section id="auth-section" class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Register</button>
            </div>
            
            <form id="login-form" class="auth-form">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form id="register-form" class="auth-form hidden">
                <h2>Register</h2>
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <select id="reg-school-type" required>
                    <option value="" disabled selected>Select School Type</option>
                    <option value="public">Public School</option>
                    <option value="american">American School</option>
                    <option value="private">Private School</option>
                </select>
                <button type="submit">Register</button>
            </form>
        </section>

        <!-- Student Dashboard -->
        <section id="dashboard-section" class="hidden">
            <div class="grid">
                <!-- Academic Results -->
                <div class="card">
                    <h3>Academic Profile</h3>
                    <form id="results-form">
                        <div id="public-fields" class="hidden">
                            <input type="number" step="0.1" id="national-score" placeholder="National Exam Score (%)">
                            <input type="text" id="exam-year" placeholder="Exam Year">
                        </div>
                        <div id="american-fields" class="hidden">
                            <input type="number" step="0.01" id="gpa" placeholder="GPA">
                            <input type="number" id="sat-score" placeholder="SAT Score">
                        </div>
                        <div id="private-fields" class="hidden">
                            <input type="text" id="curriculum" placeholder="Curriculum (IB/IGCSE)">
                            <input type="number" step="0.1" id="ib-score" placeholder="IB Score">
                        </div>
                        <button type="submit">Update Results</button>
                    </form>
                </div>

                <!-- University Matching -->
                <div class="card">
                    <h3>Find Your University</h3>
                    <button id="find-matches-btn">Auto-Match Universities</button>
                    <div id="matches-list" class="results-container">
                        <!-- Matches will appear here -->
                    </div>
                </div>
            </div>

            <!-- Applications & Chat -->
            <div class="grid mt-2">
                <div class="card">
                    <h3>My Applications</h3>
                    <div id="applications-list" class="results-container">
                        <!-- Applications will appear here -->
                    </div>
                </div>

                <div class="card">
                    <h3>Chat Support</h3>
                    <div id="chat-container">
                        <div id="chat-messages" class="chat-box"></div>
                        <div class="chat-input">
                            <input type="text" id="chat-input-text" placeholder="Ask a question...">
                            <button id="send-chat-btn">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
